server:
  port: 8080
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: authorization-server-oauth
          uri: ${AUTHORIZATION_SERVER_URI:http://127.0.0.1:9000}
          order: 1
          predicates:
            - Path=/auth/oauth2/**
          filters:
            - name: ForwardedHeaders
            - StripPrefix=1
        - id: authorization-server
          uri: ${AUTHORIZATION_SERVER_URI:http://127.0.0.1:9000}
          order: 1
          predicates:
            - Path=/auth/**
          filters:
            - name: ForwardedHeaders
            - StripPrefix=1

        - id: java-backend
          uri: ${JAVA_BACKEND_URI:http://127.0.0.1:8081}
          order: 1
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=0
            - name: JwtAuthentication

        - id: nodejs-backend
          uri: ${NODEJS_BACKEND_URI:http://127.0.0.1:3002}
          order: 2
          predicates:
            - Path=/api/entity3/**
          filters:
            - StripPrefix=0
            - name: JwtAuthentication

        - id: frontend
          uri: ${FRONTEND_URI:http://127.0.0.1:3050}
          order: 10
          predicates:
            - Path=/**
          filters:
            - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
