server:
  port: 9000
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: authorization-server
  profiles:
    active: local

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:9000/login/oauth2/code/google}

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: name

app:
  frontend-login-callback: ${FRONTEND_LOGIN_CALLBACK:http://localhost:3050/theGame/login/callback}

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity}
  expiration: 86400000

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
